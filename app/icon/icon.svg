<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The Outline Only icon: the name's two O's, linked like a chain, on the rounded square macOS icons use (824 px in
       a 1024 px canvas). Each O passes under the other once: the left one at the top crossing, the right one at the
       bottom, where a mask cuts a gap in it. Rebuild the .png and .icns with `npm run icon` after changing this file. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6440DC"/>
      <stop offset="1" stop-color="#3F2599"/>
    </linearGradient>
    <mask id="under-top" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <ellipse cx="638" cy="512" rx="180" ry="228" fill="none" stroke="#000" stroke-width="120"/>
      <rect y="512" width="1024" height="512" fill="#fff"/>
    </mask>
    <mask id="under-bottom" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <ellipse cx="386" cy="512" rx="180" ry="228" fill="none" stroke="#000" stroke-width="120"/>
      <rect width="1024" height="512" fill="#fff"/>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <ellipse cx="386" cy="512" rx="180" ry="228" fill="none" stroke="#FFFFFF" stroke-width="72" mask="url(#under-top)"/>
  <ellipse cx="638" cy="512" rx="180" ry="228" fill="none" stroke="#FFFFFF" stroke-width="72" mask="url(#under-bottom)"/>
</svg>
